<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍕 Classified Pizza Mission</title>

<style>

body{
    margin:0;
    font-family:"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#ff7b32,#ff9e4d);
    color:white;
    text-align:center;
}

.container{
    padding:40px 20px;
}

.pizza-line{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:20px;
}

.pizza{
    font-size:130px;
    display:inline-block;
    animation:cancan .8s infinite ease-in-out;
}

.delay1{animation-delay:.15s;}
.delay2{animation-delay:.30s;}
.delay3{animation-delay:.45s;}
.delay4{animation-delay:.60s;}

@keyframes cancan{

    0%{
        transform:translateY(0px) rotate(-20deg);
    }

    50%{
        transform:translateY(-40px) rotate(0deg);
    }

    100%{
        transform:translateY(0px) rotate(20deg);
    }

}

.alert-banner{
    background:white;
    color:#ff6b35;
    padding:12px;
    border-radius:12px;
    font-weight:bold;
    max-width:900px;
    margin:0 auto 20px auto;
    animation:pulse 1s infinite;
}

@keyframes pulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:.4;
    }

    100%{
        opacity:1;
    }

}

.card{
    background:rgba(255,255,255,.15);
    padding:30px;
    border-radius:25px;
    max-width:700px;
    margin:auto;
    backdrop-filter:blur(8px);
}

    font-size
